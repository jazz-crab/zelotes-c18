# Zelotes C-18 (SOAI C18) — целевое состояние устройства.
#
# Это источник истины: `c18 apply --yes` приводит мышь к этому файлу.
# Конфиг описывает намерение, а не снимок устройства: у мыши нет чтения
# конфигурации, поэтому backup/verify невозможны. Подробности — PROVISIONING.md.
#
# Важно: подсветка и DPI у этой мыши хранятся в ОДНОМ 64-байтовом пакете
# (подтверждено на железе — запись DPI-таблицы применяет и блок подсветки).
# Поэтому каждый write задаёт и подсветку, и DPI: частичной записи нет.

[device]
vid = 0x12C9
pid = 0x2003
interface = 2
usage_page = 0xFF00
usage = 0xFF00

[profile]
# Мышь хранит два профиля. Подсветка, DPI и кнопки привязаны к профилю,
# поэтому по умолчанию пишем в оба. После записи активным останется
# profile.select.
targets = [1, 2]
select = 1

[lighting]
# off | static | breathing | neon | wave | flowing
mode = "off"
# Только для static. Железо хранит бинарную маску каналов, а не 8-битный RGB,
# поэтому доступны только эти цвета: red, green, blue, yellow, purple, cyan,
# white, off.
color = "red"
# Только для static: high | mid | low.
brightness = "high"
# Для эффектов: fast | mid | slow.
speed = "mid"

[polling]
# Пока не трогаем: мышь остаётся на той частоте, что стоит сейчас.
enabled = false
# 125 | 250 | 500 | 1000
hz = 1000

[dpi]
# 1..5 — какая стадия активна после записи.
active_stage = 1
# Пять стадий, 200..10000. Чтобы DPI-кнопка не меняла чувствительность,
# все стадии одинаковые. Поменяй список, если нужны разные ступени.
stages = [2500, 2500, 2500, 2500, 2500]

# Кнопки. Номера — как в вендорской утилите (1..11); неперечисленные остаются
# заводскими. Форматы действий:
#   click:left|menu|middle|back|forward
#   key:<enter|esc|tab|space|delete|home|end|pageup|pagedown|printscreen|f1..f12|a..z|0..9>
#   shortcut:<ctrl|shift|alt|win>+<клавиша>   (например shortcut:ctrl+c)
#   media:<play-pause|stop|next|prev|mute|vol-up|vol-down>
#   dpi:<up|down|cycle>, profile:<up|down|cycle>
#   none — кнопка ничего не делает.
#
# Заводские значения: 1 left, 2 menu, 3 middle, 4 forward, 5 back,
# 6 DPI cycle, 7 W, 8 S, 9 A, 10 D, 11 Space.
[buttons]
1 = "click:left"
2 = "click:menu"
3 = "click:middle"
4 = "click:forward"            # заводское: вперёд
5 = "click:back"               # заводское: назад
6 = "media:play-pause"         # вместо DPI cycle
7 = "shortcut:alt+tab"         # переключение окон
8 = "key:enter"
9 = "shortcut:ctrl+z"          # отменить
10 = "shortcut:win+shift+s"    # скриншот области
11 = "key:printscreen"         # скриншот всего экрана
