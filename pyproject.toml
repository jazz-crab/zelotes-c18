[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zelotes-c18"
version = "1.0.0"
description = "Reproducible Zelotes C-18 (SOAI C18) mouse configuration over HID (Windows)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14.0",
]

[project.scripts]
c18 = "zelotes_c18.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
